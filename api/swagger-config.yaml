# Swagger UI configuration for viewing api/openapi.yaml outside the running app.
# The running API also serves interactive docs at /api/docs.
#   docker run -p 8081:8080 -v "$PWD/api:/api" -e SWAGGER_JSON=/api/openapi.yaml \
#     -e CONFIG_URL=/api/swagger-config.yaml swaggerapi/swagger-ui
url: /api/openapi.yaml
dom_id: "#swagger-ui"
deepLinking: true
displayOperationId: false
defaultModelsExpandDepth: 1
defaultModelExpandDepth: 2
docExpansion: list
filter: true
showExtensions: false
tryItOutEnabled: true
persistAuthorization: true
supportedSubmitMethods: [get, put, post, delete]
validatorUrl: null
