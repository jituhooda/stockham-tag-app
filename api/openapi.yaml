openapi: 3.1.0
info:
  title: eMachine data-model API (as used by Stockham Tags)
  version: "1.0.0"
  description: |
    The web app has no backend of its own; it calls these eMachine endpoints
    from the browser (through the site's /datamodel proxy by default).
    Documented from requests captured in the existing eMachine app. Items marked
    "not yet captured" are unknown and are disabled in the app.
servers:
  - url: https://emachine.instantar.io
security:
  - bearer: []
paths:
  /datamodel/api/model_query:
    get:
      summary: Run a read-only SQL query
      description: All reads. The SQL text is base64-encoded. The app's queries are in config/integrations.config.json.
      parameters:
        - name: query
          in: query
          required: true
          description: "base64 of the UTF-8 SQL text; c2VsZWN0ICogZnJvbSBtYXRlcmlhbHNfbWFzdGVy is select * from materials_master"
          schema: { type: string }
      responses:
        "200":
          description: "Rows: an array, possibly wrapped in an object with a data property"
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { type: object, additionalProperties: true }
                  - type: object
        "401": { description: Token missing, invalid or expired }
  /datamodel/api/{table}:
    post:
      summary: Insert or update one row
      description: |
        With `Id`: updates that row; only the fields sent are changed.
        Without `Id`: inserts a row (cost lines also send `tag_id`).
        The response body of an insert (where the new Id comes back) is not yet captured.
      parameters:
        - name: table
          in: path
          required: true
          schema:
            type: string
            enum: [tags, tag_labor, tag_materials, tag_equipment, tag_other_expenses]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/Tag"
                - $ref: "#/components/schemas/TagLabor"
                - $ref: "#/components/schemas/TagMaterial"
                - $ref: "#/components/schemas/TagEquipment"
                - $ref: "#/components/schemas/TagExpense"
            examples:
              updateTag: { value: "status=Draft&Id=10000113&description=add%20door&tag_date=2026-05-29&IsPremium=0" }
              insertLabor: { value: "doubletime=0&employee_name=Gabriel%20A%20Atencio&overtime=0&regularhours=0&tag_id=10000113&trade_id=10000338&employee_id=10004991" }
              updateLabor: { value: "Id=10000104&regularhours=7.00&overtime=4.00&doubletime=0.00&employee_name=Marin%20Alvarado&trade_id=10000338&employee_id=10004953" }
              updateMaterial: { value: "material_id=10000059&Id=10000126&qty=2.0&length=3" }
              updateExpense: { value: "Id=10000135&qty=35.00" }
      responses:
        "200": { description: Saved }
        "401": { description: Token missing, invalid or expired }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  schemas:
    Tag:
      type: object
      properties:
        Id: { type: integer }
        tag_number: { type: string }
        status: { type: string, examples: [Draft] }
        description: { type: string }
        tag_date: { type: string, format: date }
        IsPremium: { type: integer, enum: [0, 1] }
        JobNo: { type: string }
        JobName: { type: string }
        CustomerID: { type: string }
        PMEmail: { type: string }
        JobAddress: { type: string }
    TagLabor:
      type: object
      properties:
        Id: { type: integer }
        tag_id: { type: integer }
        employee_id: { type: integer, description: employees.Id }
        employee_name: { type: string }
        trade_id: { type: integer, description: trade.Id }
        regularhours: { type: number }
        overtime: { type: number }
        doubletime: { type: number }
    TagMaterial:
      type: object
      properties:
        Id: { type: integer }
        tag_id: { type: integer }
        material_id: { type: integer, description: materials_master.Id }
        qty: { type: number }
        length: { type: number }
    TagEquipment:
      type: object
      description: Not yet captured; fields inferred from the equipment read query.
      properties:
        Id: { type: integer }
        tag_id: { type: integer }
        equipment_id: { type: integer, description: equipment_master.Id }
        qty: { type: number }
    TagExpense:
      type: object
      properties:
        Id: { type: integer }
        tag_id: { type: integer }
        expenses_id: { type: integer, description: expenses_master.Id }
        qty: { type: number, description: The expense amount (eMachine stores it in qty) }
