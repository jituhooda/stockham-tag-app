# Development: Vite dev server with hot reload on http://localhost:5173.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up web
services:
  web:
    image: node:22-alpine
    build: !reset null
    working_dir: /repo/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_EMACHINE_WRITES: ${VITE_EMACHINE_WRITES:-false}
    volumes:
      - ./frontend:/repo/frontend
      - ./config:/repo/config:ro
      - frontend-node-modules:/repo/frontend/node_modules
    ports: !override
      - "5173:5173"

volumes:
  frontend-node-modules:
