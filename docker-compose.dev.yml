# Development overlay: source mounted, API and Vite both hot-reload.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Web app: http://localhost:5173   API docs: http://localhost:8000/api/docs
services:
  backend:
    command: ["uvicorn", "apexapp.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
      EMACHINE_MODE: ${EMACHINE_MODE:-fixtures}
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./backend/apexapp:/app/backend/apexapp
      - ./config:/app/config
      - ./database/migrations:/app/database/migrations
      - ./database/fixtures:/app/database/fixtures
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    build: !reset null
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_DEV_BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports: !override
      - "5173:5173"

volumes:
  frontend-node-modules:
