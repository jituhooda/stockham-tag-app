add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
# data: for the signature pad image. connect-src also allows eMachine for builds
# that call it directly (VITE_EMACHINE_BASE_URL set).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self' https://emachine.instantar.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Uncomment once the site is served only over HTTPS:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
