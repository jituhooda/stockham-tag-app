# Serves the built web app and forwards eMachine API calls (/datamodel/) to
# eMachine, so the browser only ever talks to this origin (no CORS needed).
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '$request_time "$http_user_agent" rid=$request_id';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  client_max_body_size 12m;

  # Resolve eMachine's address at request time (DNS can change).
  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    include /etc/nginx/security-headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # eMachine reads (model_query) and writes (/datamodel/api/<table>).
    location /datamodel/ {
      set $emachine https://emachine.instantar.io;
      proxy_pass $emachine;
      proxy_http_version 1.1;
      proxy_ssl_server_name on;
      proxy_set_header Host emachine.instantar.io;
      proxy_set_header Origin "";
      proxy_set_header Cookie "";
      proxy_read_timeout 60s;
    }

    # File uploads (Files tab) go to eMachine's cloud-storage service; allow bigger bodies than the 12m default.
    location /cloudproviders/ {
      client_max_body_size 40m;
      set $emachine https://emachine.instantar.io;
      proxy_pass $emachine;
      proxy_http_version 1.1;
      proxy_ssl_server_name on;
      proxy_set_header Host emachine.instantar.io;
      proxy_set_header Origin "";
      proxy_set_header Cookie "";
      proxy_request_buffering off;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
    }

    # Hashed build assets never change; cache for a year.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
      include /etc/nginx/security-headers.conf;
    }

    # The service worker must always be re-checked so updates reach installed apps.
    location = /sw.js {
      add_header Cache-Control "no-cache";
      include /etc/nginx/security-headers.conf;
    }

    # Client-side routes (/tags/12/cost) fall back to the app.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
