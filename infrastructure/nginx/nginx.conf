# Serves the built web app and forwards API traffic to the backend.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '$request_time "$http_user_agent" rid=$request_id';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # Attachments are limited to 10 MB by the API; leave room for multipart overhead.
  client_max_body_size 12m;

  upstream backend {
    server backend:8000;
    keepalive 16;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    include /etc/nginx/security-headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 60s;
    }

    location /health/ {
      proxy_pass http://backend;
      access_log off;
    }

    # Hashed build assets never change; cache for a year.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
      include /etc/nginx/security-headers.conf;
    }

    # Client-side routes (/tags/12/cost) fall back to the app.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
