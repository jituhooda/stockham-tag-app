# kubectl apply -k infrastructure/kubernetes
# Optional: Postgres runs elsewhere (managed service). Create the secret first:
#   kubectl -n stockham-tags create secret generic stockham-tags --from-env-file=secret.env
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stockham-tags
resources:
  - namespace.yaml
  - configmap.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - backup-cronjob.yaml
images:
  - name: stockham-tags-backend
    newName: registry.example.com/stockham/tags-backend
    newTag: "1.0.0"
  - name: stockham-tags-frontend
    newName: registry.example.com/stockham/tags-frontend
    newTag: "1.0.0"
