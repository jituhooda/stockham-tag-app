apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: stockham-tags, component: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: stockham-tags, component: frontend }
  template:
    metadata:
      labels: { app: stockham-tags, component: frontend }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 101 }
      containers:
        - name: web
          image: stockham-tags-frontend
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: stockham-tags, component: frontend }
  ports: [{ port: 80, targetPort: http, name: http }]
