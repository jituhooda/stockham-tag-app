# Nightly database + attachments backup into the same volume (copy it off-cluster
# with your storage tooling).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
          containers:
            - name: backup
              image: stockham-tags-backend
              command: ["python", "-m", "apexapp.database.backup", "create", "--out", "/data/backups"]
              envFrom:
                - configMapRef: { name: stockham-tags }
                - secretRef: { name: stockham-tags }
              volumeMounts:
                - { name: data, mountPath: /data }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: stockham-tags-attachments }
