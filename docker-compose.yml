# The web app behind nginx on http://localhost:8080. nginx serves the built app
# and forwards /datamodel/ to eMachine. There is no backend or database.
#   docker compose up -d --build
# Saving to eMachine is off unless VITE_EMACHINE_WRITES=true at build time.
name: stockham-tags

services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_EMACHINE_WRITES: ${VITE_EMACHINE_WRITES:-false}
    image: stockham-tags-web:${APP_VERSION:-1.0.0}
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
