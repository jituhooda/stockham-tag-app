# Production overlay: PostgreSQL, token auth, JSON logs, optional Prometheus.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   … --profile monitoring up -d     # also start Prometheus on :9090
# Set POSTGRES_PASSWORD, EMACHINE_API_TOKEN and AUTH_TOKENS in .env.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockham_tags
      POSTGRES_USER: stockham
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockham -d stockham_tags"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://stockham:${POSTGRES_PASSWORD}@postgres:5432/stockham_tags
      AUTH_MODE: ${AUTH_MODE:-token}
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 512m }

  frontend:
    deploy:
      resources:
        limits: { memory: 128m }

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [monitoring]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  pg-data:
